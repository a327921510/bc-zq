# 粘贴到宝塔「网站 → 配置文件」的 server { ... } 内。
# 建站：传统项目。IP 未占用 80 时域名填公网 IP；已有 IP 站时新建站点名（如 bc-zq）并把 listen 改为 8001。
# 应用挂在 /zq 子路径；路径按实际部署目录调整；改完后「保存」并重载 Nginx。
# 对外 8001 时需在安全组放行；本机 uvicorn 仍为 127.0.0.1:8000，勿对公网开放 8000。
# location 必须用 ^~ /zq/：否则宝塔默认的 js/css 正则会抢走静态资源导致 404。

# —— IP 白名单（整站或仅本 location，按你站点策略）——
# 开通：编辑 ops/allowed_ips.conf，增加一行 allow x.x.x.y; 后重载
include /www/wwwroot/bc-zq/ops/allowed_ips.conf;

# —— 防收录（正规爬虫；恶意爬虫仍靠白名单挡）——
location = /robots.txt {
    root /www/wwwroot/bc-zq/ops;
    default_type text/plain;
}

# 无尾斜杠时跳到 /zq/
location = /zq {
    return 301 /zq/;
}

# 页面 + API + 静态资源：整段反代到 uvicorn（应用内 BASE_PATH=/zq）
location ^~ /zq/ {
    proxy_pass http://127.0.0.1:8000/zq/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
